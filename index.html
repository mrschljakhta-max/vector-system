<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VECTOR — навігація</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8e8e6;font-family:'Rajdhani',Arial,sans-serif;color:#181818;background-image:url('./assets/bg-light.png');background-size:cover;background-position:center;overflow:hidden}
    body::after{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(255,255,255,0) 0 48%,rgba(255,255,255,.22) 70%,rgba(255,255,255,.04));pointer-events:none}
    .box{position:relative;z-index:1;padding:40px 46px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.58);backdrop-filter:blur(14px);box-shadow:0 20px 80px rgba(0,0,0,.12);text-align:center;clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
    .brand{display:flex;align-items:center;justify-content:center;gap:16px}.brand img{width:50px;height:50px;object-fit:contain}.brand h1{letter-spacing:.22em;margin:0;font-size:54px;font-weight:600}.kicker{letter-spacing:.38em;text-transform:uppercase;color:#61666d;margin:12px 0 0}.links{display:flex;gap:14px;margin-top:30px}a{padding:13px 24px;text-decoration:none;color:#fff;background:#1d1f21;letter-spacing:.12em;text-transform:uppercase;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}a:hover{filter:brightness(1.1)}@media(max-width:700px){.links{flex-direction:column}.brand h1{font-size:38px}.box{margin:20px}.kicker{letter-spacing:.18em}}
  </style>
</head>
<body>
  <main class="box">
    <div class="brand">
      <img src="./assets/logo-dark.png" alt="VECTOR" />
      <h1>VECTOR</h1>
    </div>
    <p class="kicker">аналітична система</p>
    <div class="links">
      <a href="./official/">Офіційний сайт</a>
      <a href="./admin/">Адмін-сайт</a>
    </div>
  </main>
</body>
</html>
