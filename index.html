<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ВЕКТОР — навігація</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8e8e6;font-family:Arial,sans-serif;color:#181818;background-image:url('./assets/bg-light.png');background-size:cover;background-position:center}
    .box{padding:40px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.55);backdrop-filter:blur(14px);box-shadow:0 20px 80px rgba(0,0,0,.12);text-align:center}
    img{width:76px;height:76px;object-fit:contain;margin-bottom:14px}h1{letter-spacing:.28em;margin:0 0 10px;font-size:44px}.links{display:flex;gap:14px;margin-top:24px}a{padding:14px 24px;text-decoration:none;color:#fff;background:#1d1f21;border-radius:4px;letter-spacing:.12em;text-transform:uppercase}a:hover{background:#333}@media(max-width:700px){.links{flex-direction:column}h1{font-size:34px}}
  </style>
</head>
<body>
  <main class="box">
    <img src="./assets/logo-dark.png" alt="Вектор" />
    <h1>ВЕКТОР</h1>
    <p>Один репозиторій / два сайти</p>
    <div class="links">
      <a href="./official/">Офіційний сайт</a>
      <a href="./admin/">Адмін-сайт</a>
    </div>
  </main>
</body>
</html>
