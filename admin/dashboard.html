<!doctype html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VECTOR - Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon-192.png" />
  <link rel="apple-touch-icon" href="../assets/favicon-192.png" />
  <meta name="theme-color" content="#111418" />
</head>
<body>
  <main class="admin-layout">
    <aside class="admin-sidebar" aria-label="Навігація адмін-панелі">
      <a class="admin-sidebar__logo" href="./dashboard.html" aria-label="VECTOR admin dashboard">
        <img class="admin-sidebar__logo-img admin-sidebar__logo-img--light" src="../assets/logo-dark.png" alt="VECTOR">
        <img class="admin-sidebar__logo-img admin-sidebar__logo-img--dark" src="../assets/logo-light.png" alt="VECTOR">
      </a>

      <nav class="admin-nav">
        <a class="admin-nav__item is-active" href="#" data-page="grant-access">
          <span class="admin-nav__icon">+</span>
          <span>Надати доступ</span>
        </a>
        <a class="admin-nav__item" href="#" data-page="users">
          <span class="admin-nav__icon">◎</span>
          <span>Користувачі</span>
        </a>
        <a class="admin-nav__item" href="#" data-page="admin-access">
          <span class="admin-nav__icon">▣</span>
          <span>Адмін-доступ</span>
        </a>
        <a class="admin-nav__item" href="#" data-page="requests">
          <span class="admin-nav__icon">◇</span>
          <span>Заявки</span>
        </a>
        <a class="admin-nav__item" href="#" data-page="logs">
          <span class="admin-nav__icon">≋</span>
          <span>Логування</span>
        </a>
        <a class="admin-nav__item" href="#" data-page="settings">
          <span class="admin-nav__icon">⚙</span>
          <span>Налаштування</span>
        </a>
      </nav>

      <button class="admin-nav__logout" id="logoutBtn" type="button">
        <span class="admin-nav__icon">↩</span>
        <span>Вийти</span>
      </button>
    </aside>

    <section class="admin-workspace" aria-label="Робоча область адмін-панелі">
      <button class="theme-toggle admin-theme-toggle" id="themeToggle" type="button" aria-label="Перемкнути тему">
        <span class="theme-toggle__track"><span class="theme-toggle__dot"></span></span>
        <span class="theme-toggle__text" id="themeLabel">Світла</span>
      </button>

      <div class="admin-empty-body" aria-hidden="true"></div>
    </section>
  </main>

  <script src="./dashboard.js"></script>
</body>
</html>
