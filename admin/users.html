<!doctype html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VECTOR - Користувачі</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
  <meta name="theme-color" content="#111418" />
</head>
<body>
  <main class="admin-shell">
    <aside class="simple-sidebar">
      <a class="simple-logo" href="./access.html">VECTOR</a>
      <nav class="simple-nav">
        <a href="./access.html">Доступ</a>
        <a class="is-active" href="./users.html">Користувачі</a>
      </nav>
      <button class="admin-nav__logout" id="logoutBtn" type="button">Вийти</button>
    </aside>

    <section class="simple-workspace">
      <button class="theme-toggle admin-theme-toggle" id="themeToggle" type="button" aria-label="Перемкнути тему">
        <span class="theme-toggle__track"><span class="theme-toggle__dot"></span></span>
        <span class="theme-toggle__text" id="themeLabel">Темна</span>
      </button>

      <header class="simple-head">
        <div>
          <p class="simple-kicker">локальна база доступу</p>
          <h1>Зареєстровані користувачі</h1>
        </div>
        <a class="simple-link" href="./access.html">Створити користувача</a>
      </header>

      <section class="simple-card">
        <div class="simple-toolbar">
          <input id="usersSearch" type="search" placeholder="Пошук за email, маркером або роллю">
          <button class="ghost-action danger" id="clearUsers" type="button">Очистити</button>
        </div>

        <div class="local-users-wrap">
          <table class="local-users-table">
            <thead>
              <tr>
                <th>Email</th>
                <th>Ключ входу</th>
                <th>Маркер</th>
                <th>Роль</th>
                <th>Статус</th>
                <th>Дії</th>
              </tr>
            </thead>
            <tbody id="localUsersBody"></tbody>
          </table>
          <p class="users-empty" id="usersEmpty">Користувачів ще не створено.</p>
        </div>
      </section>
    </section>
  </main>
  <script src="./admin-common.js"></script>
</body>
</html>
