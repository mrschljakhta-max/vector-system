<!doctype html>
<html lang="uk" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VECTOR - Користувачі</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<section class="users-page">
  <h1 class="users-title">КОРИСТУВАЧІ</h1>

  <div class="users-panel">
    <div class="users-panel__top">
      <p>Перегляд, керування та контроль доступу користувачів системи.</p>
      <button class="users-refresh">ОНОВИТИ</button>
    </div>

    <div class="users-stats">
      <div class="users-stat"><span>Всього користувачів</span><strong>5</strong></div>
      <div class="users-stat"><span>Активних</span><strong>4</strong></div>
      <div class="users-stat"><span>На етапі реєстрації</span><strong>1</strong></div>
    </div>

    <div class="users-filters">
      <input type="text" placeholder="Логін, email або роль...">
      <select><option>Усі користувачі</option></select>
    </div>
  </div>
</section>
</body>
</html>
