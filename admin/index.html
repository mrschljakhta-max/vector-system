<!doctype html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VΞCTØR Admin — вхід</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <meta name="theme-color" content="#111418" />
</head>
<body>
  <main class="page admin-page">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Перемкнути тему">
      <span class="theme-toggle__track"><span class="theme-toggle__dot"></span></span>
      <span class="theme-toggle__text" id="themeLabel">Світла</span>
    </button>

    <button class="entry-trigger" id="openLogin" type="button" aria-haspopup="dialog">
      <span class="entry-trigger__line"></span>
      <span class="entry-trigger__text">Вхід</span>
      <span class="entry-trigger__line"></span>
    </button>

    <a class="official-link" href="../official/">Офіційний сайт</a>

    <section class="auth-modal" id="authModal" aria-hidden="true">
      <div class="auth-panel" role="dialog" aria-modal="true" aria-labelledby="authTitle">
        <button class="modal-close" id="closeModal" type="button" aria-label="Закрити">×</button>
        <form class="auth-form is-active" id="loginForm" autocomplete="on">
          <h2 id="authTitle">Вхід адміністратора</h2>
          <label>
            <span>Логін</span>
            <input type="text" name="login" placeholder="Введіть логін" autocomplete="username" required />
          </label>
          <label>
            <span>Пароль</span>
            <input type="password" name="password" placeholder="Введіть пароль" autocomplete="current-password" required />
          </label>
          <button class="submit-btn" type="submit">Увійти</button>
        </form>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
