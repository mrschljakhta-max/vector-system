<!doctype html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VΞCTØR Admin — вхід</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <meta name="theme-color" content="#111418" />
</head>
<body>
  <div class="page official-page">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Перемкнути тему">
      <span class="theme-toggle__track"><span class="theme-toggle__dot"></span></span>
      <span class="theme-toggle__text" id="themeLabel">Світла</span>
    </button>

    <main class="auth-panel auth-panel--admin" aria-label="Адміністративна авторизація VΞCTØR">
      <div class="auth-tabs" role="tablist" aria-label="Режим авторизації">
        <button class="auth-tab is-active" id="loginTab" type="button" data-auth-mode="login">Admin</button>
      </div>

      <form class="auth-form auth-form--login is-active" id="loginForm">
        <label>
          <span>Логін</span>
          <input type="text" name="login" autocomplete="username" placeholder="Введіть логін" required />
        </label>
        <label>
          <span>Пароль</span>
          <input type="password" name="password" autocomplete="current-password" placeholder="Введіть пароль" required />
        </label>
        <button class="submit-btn" type="submit">Увійти як адміністратор</button>
      </form>

      <p class="auth-note" id="authNote">Панель керування доступом користувачів.</p>
    </main>
  </div>
  <div class="hero-actions"><a href="#" class="hero-btn">Вхід</a><a href="#" class="hero-btn">Реєстрація</a></div>
  <script src="./app.js"></script>
</body>
</html>
