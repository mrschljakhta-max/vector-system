<!doctype html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VECTOR — служба РЕ та КБ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./landing-fix.css?v=20260703-5" />
  <link rel="stylesheet" href="./workspace-nav.css?v=20260703-3" />
  <link rel="stylesheet" href="./map-fix.css?v=20260703-1" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
  <meta name="theme-color" content="#111418" />
</head>
<body>
  <main class="page official-page official-start">
    <picture class="landing-bg" aria-hidden="true"><img src="../assets/vector-bg-dark.png" alt="" /></picture>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Перемкнути тему"><span class="theme-toggle__track"><span class="theme-toggle__dot"></span></span><span class="theme-toggle__text" id="themeLabel">Темна</span></button>
    <section class="landing" id="landingScreen"><button class="entry-trigger" id="openLogin" type="button" aria-haspopup="dialog"><span class="entry-trigger__line"></span><span class="entry-trigger__text">Вхід</span><span class="entry-trigger__line"></span></button></section>
    <section class="auth-modal" id="authModal" aria-hidden="true"><div class="auth-panel" role="dialog" aria-modal="true" aria-labelledby="authTitle"><button class="modal-close" id="closeModal" type="button" aria-label="Закрити">×</button><div class="auth-head"><button class="auth-tab is-active" type="button" data-auth-mode="login">Вхід</button><button class="auth-tab" type="button" data-auth-mode="register">Подати заявку</button></div><form class="auth-form is-active" id="loginForm" autocomplete="on"><h2 id="authTitle">VECTOR</h2><label><span>Логін</span><input type="text" name="login" placeholder="Введіть логін" autocomplete="username" required /></label><label><span>Пароль</span><input type="password" name="password" placeholder="Введіть пароль" autocomplete="current-password" required /></label><button class="submit-btn" type="button" onclick="enterVector()">Увійти</button><p class="auth-note">Доступ створюється на адмін-сайті.</p></form><form class="auth-form" id="registerForm" autocomplete="on"><h2>Подати заявку</h2><label><span>Email</span><input type="email" name="email" placeholder="name@example.com" autocomplete="email" required /></label><button class="submit-btn" type="submit">Надіслати заявку</button></form></div></section>
    <section class="workspace vector-workspace" id="workspace" aria-hidden="true">
      <aside class="hover-nav hover-nav--left" aria-label="Робоча навігація">
        <button class="hover-nav__item is-active nav__item" data-section="map" type="button"><img src="../assets/map-pin-share.svg" alt=""><span>Карта</span></button>
        <button class="hover-nav__item nav__item" data-section="refs" type="button"><img src="../assets/book-icon.svg" alt=""><span>Бібліотека</span></button>
        <button class="hover-nav__item hover-nav__item--bottom" type="button" onclick="logoutVector()"><span class="nav-icon-text">⎋</span><span>Вихід</span></button>
      </aside>
      <aside class="hover-nav hover-nav--right map-layer-nav" aria-label="Тип карти">
        <button class="hover-nav__item layer-btn is-active" data-layer="osm" type="button"><span class="nav-icon-text">◈</span><span>OSM</span></button>
        <button class="hover-nav__item layer-btn" data-layer="roads" type="button"><span class="nav-icon-text">╬</span><span>Дороги</span></button>
        <button class="hover-nav__item layer-btn" data-layer="sat" type="button"><span class="nav-icon-text">◉</span><span>Супутник</span></button>
        <button class="hover-nav__item layer-btn" data-layer="topo" type="button"><span class="nav-icon-text">△</span><span>Топо</span></button>
        <button class="hover-nav__item layer-btn" data-layer="dark" type="button"><span class="nav-icon-text">▣</span><span>Темна</span></button>
        <button class="hover-nav__item layer-btn" data-layer="nato" type="button"><span class="nav-icon-text">✚</span><span>NATO</span></button>
      </aside>
      <section class="map-shell content"><article class="section is-active" id="map" data-title="Карта"><div id="vectorMap" class="leaflet-map"></div></article><article class="section library-section" id="refs" data-title="Бібліотека"><header class="library-head"><p class="eyebrow">Бібліотека</p><h1>Довідники та файли</h1><p>Місце для завантаження довідників, таблиць, карт, схем та інших матеріалів.</p></header><div class="upload-grid" id="uploadGrid"></div><div class="table-card"><div class="table-card__head"><h4>Реєстр завантажених файлів</h4><button class="ghost-btn" id="clearFiles" type="button">Очистити</button></div><div class="file-list" id="fileList">Файли ще не додані.</div></div></article></section>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./app.js?v=20260703-2"></script>
  <script>
    let vectorMap, activeLayer; const layers={osm:['https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png','© OpenStreetMap contributors'],roads:['https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png','© OpenStreetMap contributors, HOT'],sat:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}','Tiles © Esri'],topo:['https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png','© OpenTopoMap contributors'],dark:['https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png','© OpenStreetMap © CARTO'],nato:['https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png','© OpenStreetMap contributors']};
    function initVectorMap(){if(vectorMap||!window.L)return;vectorMap=L.map('vectorMap',{zoomControl:false}).setView([48.86,37.60],9);L.control.zoom({position:'bottomright'}).addTo(vectorMap);setMapLayer('osm');}
    function setMapLayer(key){if(!vectorMap)return;if(activeLayer)vectorMap.removeLayer(activeLayer);const cfg=layers[key]||layers.osm;activeLayer=L.tileLayer(cfg[0],{maxZoom:19,attribution:cfg[1]}).addTo(vectorMap);document.querySelectorAll('.layer-btn').forEach(b=>b.classList.toggle('is-active',b.dataset.layer===key));}
    function enterVector(){document.getElementById('authModal')?.classList.remove('is-open');document.getElementById('landingScreen')?.setAttribute('hidden','true');document.querySelector('.landing-bg')?.setAttribute('hidden','true');const w=document.getElementById('workspace');if(w){w.classList.add('is-open');w.setAttribute('aria-hidden','false');}setTimeout(()=>{initVectorMap();vectorMap&&vectorMap.invalidateSize();},150);}
    function logoutVector(){const w=document.getElementById('workspace');if(w){w.classList.remove('is-open');w.setAttribute('aria-hidden','true');}document.getElementById('landingScreen')?.removeAttribute('hidden');document.querySelector('.landing-bg')?.removeAttribute('hidden');document.getElementById('authModal')?.classList.remove('is-open');}
    document.querySelectorAll('.layer-btn').forEach(b=>b.addEventListener('click',()=>setMapLayer(b.dataset.layer)));document.querySelectorAll('.nav__item').forEach(b=>b.addEventListener('click',()=>setTimeout(()=>vectorMap&&vectorMap.invalidateSize(),80)));
  </script>
</body>
</html>
