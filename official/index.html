<!doctype html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VECTOR — служба РЕ та КБ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./landing-fix.css?v=20260703-5" />
  <link rel="stylesheet" href="./workspace-nav.css?v=20260703-3" />
  <link rel="stylesheet" href="./map-fix.css?v=20260703-3" />
  <link rel="stylesheet" href="./data-import.css?v=20260704-3" />
  <link rel="stylesheet" href="./map-tools-layout.css?v=20260706-clusters-1" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
  <meta name="theme-color" content="#111418" />
</head>
<body>
  <main class="page official-page official-start">
    <picture class="landing-bg" aria-hidden="true"><img src="../assets/vector-bg-dark.png" alt="" /></picture>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Перемкнути тему"><span class="theme-toggle__track"><span class="theme-toggle__dot"></span></span><span class="theme-toggle__text" id="themeLabel">Темна</span></button>
    <section class="landing" id="landingScreen"><button class="entry-trigger" id="openLogin" type="button" aria-haspopup="dialog"><span class="entry-trigger__line"></span><span class="entry-trigger__text">Вхід</span><span class="entry-trigger__line"></span></button></section>
    <section class="auth-modal" id="authModal" aria-hidden="true"><div class="auth-panel" role="dialog" aria-modal="true" aria-labelledby="authTitle"><button class="modal-close" id="closeModal" type="button" aria-label="Закрити">×</button><div class="auth-head"><button class="auth-tab is-active" type="button" data-auth-mode="login">Вхід</button><button class="auth-tab" type="button" data-auth-mode="register">Подати заявку</button></div><form class="auth-form is-active" id="loginForm" autocomplete="on"><h2 id="authTitle">VECTOR</h2><label><span>Логін</span><input type="text" name="login" placeholder="Введіть логін" autocomplete="username" required /></label><label><span>Пароль</span><input type="password" name="password" placeholder="Введіть пароль" autocomplete="current-password" required /></label><button class="submit-btn" type="button" onclick="enterVector()">Увійти</button><p class="auth-note">Доступ створюється на адмін-сайті.</p></form><form class="auth-form" id="registerForm" autocomplete="on"><h2>Подати заявку</h2><label><span>Email</span><input type="email" name="email" placeholder="name@example.com" autocomplete="email" required /></label><button class="submit-btn" type="submit">Надіслати заявку</button></form></div></section>
    <section class="workspace vector-workspace" id="workspace" aria-hidden="true">
      <aside class="hover-nav hover-nav--left" aria-label="Робоча навігація"><button class="hover-nav__item is-active nav__item" data-section="map" type="button"><img src="../assets/map-pin-share.svg" alt=""><span>Карта</span></button><button class="hover-nav__item nav__item" data-section="refs" type="button"><img src="../assets/book-icon.svg" alt=""><span>Бібліотека</span></button><button class="hover-nav__item hover-nav__item--bottom" type="button" onclick="logoutVector()"><span class="nav-icon-text">⎋</span><span>Вихід</span></button></aside>
      <aside class="hover-nav hover-nav--right map-layer-nav" aria-label="Тип карти"><button class="hover-nav__item" type="button" onclick="openMapDialog()"><span class="nav-icon-text">▧</span><span>Типи карт</span></button></aside>
      <section class="map-shell content"><article class="section is-active" id="map" data-title="Карта"><iframe class="osm-fallback" src="https://www.openstreetmap.org/export/embed.html?bbox=37.0%2C48.45%2C38.2%2C49.25&amp;layer=mapnik" loading="lazy"></iframe><div id="vectorMap" class="leaflet-map"></div></article><article class="section library-section" id="refs" data-title="Бібліотека"><header class="library-head"><p class="eyebrow">Бібліотека</p><h1>Довідники та файли</h1><p>Місце для завантаження довідників, таблиць, карт, схем та інших матеріалів.</p></header><div class="upload-grid" id="uploadGrid"></div><div class="table-card"><div class="table-card__head"><h4>Реєстр завантажених файлів</h4><button class="ghost-btn" id="clearFiles" type="button">Очистити</button></div><div class="file-list" id="fileList">Файли ще не додані.</div></div></article></section>
    </section>
    <section class="map-dialog" id="mapDialog" aria-hidden="true"><div class="map-dialog__panel"><div class="map-dialog__head"><h2>Тип карти</h2><button class="map-dialog__close" type="button" onclick="closeMapDialog()">×</button></div><div class="map-dialog__grid"><button class="map-type-card is-active" data-layer="white" type="button"><strong>Біла карта</strong><span>Світла мінімалістична карта</span></button><button class="map-type-card" data-layer="osm" type="button"><strong>OSM</strong><span>Базова карта OpenStreetMap</span></button><button class="map-type-card" data-layer="roads" type="button"><strong>Дороги</strong><span>Дорожня карта</span></button><button class="map-type-card" data-layer="sat" type="button"><strong>Супутник</strong><span>Супутникове зображення</span></button><button class="map-type-card" data-layer="topo" type="button"><strong>Топо</strong><span>Топографічна карта</span></button><button class="map-type-card" data-layer="dark" type="button"><strong>Темна</strong><span>Темна службова підкладка</span></button></div></div></section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.VECTOR_SUPABASE_URL='https://vfshxogiuaefrgppuypt.supabase.co';window.VECTOR_SUPABASE_KEY='sb_publishable_yenD-zpmlFuhKKnojukBZg_z7pr_jzg';</script><script src="./map-polygons-control.js?v=20260706-flicker-fix-1" defer></script><script src="./map-station-radius-fix.js?v=20260706-flicker-fix-1" defer></script><script src="./map-clusters.js?v=20260706-clusters-1" defer></script><script src="./app.js?v=20260706-clusters-1"></script><script src="./data-import.js?v=20260704-3"></script>
  <script>let vectorMap,activeLayer;const layers={white:['https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png','CARTO Light'],osm:['https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png','OSM'],roads:['https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png','OSM HOT'],sat:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}','Esri'],topo:['https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png','OpenTopoMap'],dark:['https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png','CARTO']};function initVectorMap(){if(vectorMap||!window.L)return;vectorMap=L.map('vectorMap',{zoomControl:false}).setView([48.86,37.60],9);L.control.zoom({position:'bottomright'}).addTo(vectorMap);setMapLayer('white');document.getElementById('vectorMap')?.classList.add('is-ready')}function setMapLayer(k){if(!vectorMap)return;if(activeLayer)vectorMap.removeLayer(activeLayer);const c=layers[k]||layers.white;activeLayer=L.tileLayer(c[0],{maxZoom:19,attribution:c[1]}).addTo(vectorMap);document.querySelectorAll('.map-type-card').forEach(b=>b.classList.toggle('is-active',b.dataset.layer===k));closeMapDialog()}function openMapDialog(){document.getElementById('mapDialog')?.classList.add('is-open');document.getElementById('mapDialog')?.setAttribute('aria-hidden','false')}function closeMapDialog(){document.getElementById('mapDialog')?.classList.remove('is-open');document.getElementById('mapDialog')?.setAttribute('aria-hidden','true')}function enterVector(){document.getElementById('authModal')?.classList.remove('is-open');document.getElementById('landingScreen')?.setAttribute('hidden','true');document.querySelector('.landing-bg')?.setAttribute('hidden','true');const w=document.getElementById('workspace');if(w){w.classList.add('is-open');w.setAttribute('aria-hidden','false')}setTimeout(()=>{initVectorMap();vectorMap&&vectorMap.invalidateSize()},250)}function logoutVector(){const w=document.getElementById('workspace');if(w){w.classList.remove('is-open');w.setAttribute('aria-hidden','true')}document.getElementById('landingScreen')?.removeAttribute('hidden');document.querySelector('.landing-bg')?.removeAttribute('hidden');document.getElementById('authModal')?.classList.remove('is-open')}document.querySelectorAll('.map-type-card').forEach(b=>b.addEventListener('click',()=>setMapLayer(b.dataset.layer)));document.querySelectorAll('.nav__item').forEach(b=>b.addEventListener('click',()=>setTimeout(()=>vectorMap&&vectorMap.invalidateSize(),80)));setTimeout(()=>{if(document.getElementById('workspace')?.classList.contains('is-open'))initVectorMap()},500);</script>
</body>
</html>
