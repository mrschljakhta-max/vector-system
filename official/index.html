<!doctype html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VΞCTØR — вхід</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="page official-page">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Перемкнути тему">
      <span class="theme-toggle__track"><span class="theme-toggle__dot"></span></span>
      <span class="theme-toggle__text" id="themeLabel">Світла</span>
    </button>

    <main class="auth-panel" aria-label="Авторизація VΞCTØR">
      <div class="auth-tabs" role="tablist" aria-label="Режим авторизації">
        <button class="auth-tab is-active" id="loginTab" type="button" data-auth-mode="login">Вхід</button>
        <button class="auth-tab" id="registerTab" type="button" data-auth-mode="register">Реєстрація</button>
      </div>

      <form class="auth-form auth-form--login is-active" id="loginForm">
        <label>
          <span>Логін</span>
          <input type="text" name="login" autocomplete="username" placeholder="Введіть логін" required />
        </label>
        <label>
          <span>Пароль</span>
          <input type="password" name="password" autocomplete="current-password" placeholder="Введіть пароль" required />
        </label>
        <button class="submit-btn" type="submit">Увійти</button>
      </form>

      <form class="auth-form auth-form--register" id="registerForm">
        <label>
          <span>Логін</span>
          <input type="text" name="login" autocomplete="username" placeholder="Створіть логін" required />
        </label>
        <label>
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" placeholder="name@example.com" required />
        </label>
        <label>
          <span>Пароль</span>
          <input type="password" name="password" autocomplete="new-password" placeholder="Створіть пароль" required />
        </label>
        <button class="submit-btn submit-btn--light" type="submit">Надіслати заявку</button>
      </form>

      <p class="auth-note" id="authNote">Доступ надається після підтвердження адміністратором.</p>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
