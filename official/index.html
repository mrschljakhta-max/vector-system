<!doctype html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VECTOR — вхід</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="page official-page">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Перемкнути тему">
      <span class="theme-toggle__track">
        <span class="theme-toggle__dot"></span>
      </span>
      <span class="theme-toggle__text" id="themeLabel">Світла</span>
    </button>

    <main class="brand-panel" aria-label="Вхід до системи VECTOR">
      <div class="brand-title">
        <img class="brand-logo brand-logo--dark" src="../assets/logo-dark.png" alt="VECTOR" />
        <img class="brand-logo brand-logo--light" src="../assets/logo-light.png" alt="VECTOR" />
        <h1>VECTOR</h1>
      </div>

      <div class="brand-kicker">АНАЛІТИЧНА СИСТЕМА</div>

      <div class="entry-group" aria-label="Дії користувача">
        <button class="entry-segment entry-segment--primary" id="openLogin" type="button">
          <span class="entry-icon">↪</span>
          <span>Вхід</span>
        </button>
        <button class="entry-segment entry-segment--secondary" id="openRegister" type="button">
          <span>Реєстрація</span>
          <span class="entry-icon">⊕</span>
        </button>
      </div>
    </main>

    <dialog class="login-modal" id="loginModal">
      <form method="dialog" class="login-card">
        <button class="close" value="cancel" aria-label="Закрити">×</button>
        <p class="modal-kicker">офіційний доступ</p>
        <h2>Вхід до системи</h2>
        <label>Логін<input type="text" autocomplete="username" /></label>
        <label>Пароль<input type="password" autocomplete="current-password" /></label>
        <button class="submit" value="default">Увійти</button>
      </form>
    </dialog>

    <dialog class="login-modal" id="registerModal">
      <form method="dialog" class="login-card">
        <button class="close" value="cancel" aria-label="Закрити">×</button>
        <p class="modal-kicker">запит доступу</p>
        <h2>Реєстрація</h2>
        <label>Імʼя<input type="text" autocomplete="name" /></label>
        <label>Email<input type="email" autocomplete="email" /></label>
        <label>Повідомлення<input type="text" /></label>
        <button class="submit" value="default">Надіслати запит</button>
      </form>
    </dialog>
  </div>
  <script src="./app.js"></script>
</body>
</html>
