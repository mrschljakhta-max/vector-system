<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VECTOR — Аналітика</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0f16;color:#e7edf7;font-family:'Rajdhani',Arial,sans-serif}.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 22px;background:rgba(11,15,22,.96);border-bottom:1px solid rgba(255,255,255,.1)}.topbar a,.btn{color:#d78219;text-decoration:none;text-transform:uppercase;letter-spacing:.12em}.wrap{padding:30px 42px}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}.eyebrow{color:#d78219;text-transform:uppercase;letter-spacing:.18em;margin:0 0 8px}h1{margin:0;font-size:42px;letter-spacing:.14em;text-transform:uppercase}.muted{color:#9aa7bd}.btn{border:1px solid rgba(215,130,25,.65);background:rgba(215,130,25,.08);padding:11px 16px;cursor:pointer}.status{margin:0 0 18px;color:#9aa7bd}.grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:14px;margin-bottom:22px}.card{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);padding:18px;min-height:116px;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}.card small{display:block;color:#9aa7bd;text-transform:uppercase;letter-spacing:.12em}.card strong{display:block;margin-top:12px;font-size:34px;line-height:1}.card span{display:block;margin-top:8px;color:#c5cfdf}.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);padding:20px;min-height:260px}.panel h2{margin:0 0 14px;font-size:24px;letter-spacing:.08em}.table{width:100%;border-collapse:collapse;font-size:15px}.table th,.table td{border-bottom:1px solid rgba(255,255,255,.1);padding:10px 8px;text-align:left}.table th{color:#9aa7bd;text-transform:uppercase;font-size:12px;letter-spacing:.1em}.list{display:grid;gap:10px}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08)}.item span{color:#9aa7bd}.err{padding:14px;border:1px solid #ef4444;color:#fecaca;background:rgba(239,68,68,.08);white-space:pre-wrap}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}.wrap{padding:24px}}@media(max-width:650px){.grid{grid-template-columns:1fr}.head{display:block}h1{font-size:30px}}
  </style>
</head>
<body>
  <nav class="topbar"><a href="./">← До карти</a><b>VECTOR Analytics</b></nav>
  <main class="wrap">
    <section class="head"><div><p class="eyebrow">VECTOR Analytics</p><h1>Аналітика</h1><p class="muted">Прямий розрахунок із Supabase без залежності від карти та старої навігації.</p></div><button class="btn" id="refresh">Оновити</button></section>
    <p class="status" id="status">Завантаження...</p>
    <section class="grid" id="kpi"></section>
    <section class="panels"><article class="panel"><h2>Покриття</h2><div id="coverage">—</div></article><article class="panel"><h2>Неприкриті ВП/СП</h2><div id="uncovered">—</div></article></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const URL='https://vfshxogiuaefrgppuypt.supabase.co';
    const KEY='sb_publishable_yenD-zpmlFuhKKnojukBZg_z7pr_jzg';
    const sb=window.supabase.createClient(URL,KEY);
    const q=s=>document.querySelector(s);
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pct=(a,b)=>b?Math.round(a/b*100)+'%':'0%';
    const geo=r=>Number.isFinite(Number(r.lat))&&Number.isFinite(Number(r.lon));
    const rad=v=>v*Math.PI/180;
    function km(a,b){const R=6371,lat1=rad(+a.lat),lat2=rad(+b.lat),dLat=lat2-lat1,dLon=rad(+b.lon-+a.lon);const x=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
    async function count(table){const {count,error}=await sb.from(table).select('*',{count:'exact',head:true}); if(error) throw new Error(table+': '+error.message); return count??0;}
    async function rows(table,cols,limit=5000){const {data,error}=await sb.from(table).select(cols).limit(limit); if(error) throw new Error(table+': '+error.message); return data||[];}
    function kpi(items){q('#kpi').innerHTML=items.map(i=>`<article class="card"><small>${esc(i[0])}</small><strong>${esc(i[1])}</strong><span>${esc(i[2])}</span></article>`).join('');}
    async function run(){
      q('#status').textContent='Розраховую показники...';
      q('#coverage').textContent='—'; q('#uncovered').textContent='—';
      try{
        const [cover,stations,req,events]=await Promise.all([
          rows('dict_cover_objects','object_name,object_type,type_code,mgrs,lat,lon,is_active',2000),
          rows('dict_stations','station_name,station_code,status_text,lat,lon,mgrs,coverage_radius_km,is_active',1000),
          count('norm_excel_requests'),
          count('norm_word_events')
        ]);
        const active=cover.filter(r=>r.is_active!==false);
        const st=stations.filter(r=>r.is_active!==false);
        const objs=active.filter(geo), sts=st.filter(geo);
        const vp=active.filter(r=>String(r.object_type||r.type_code||'').toUpperCase().includes('ВП')||String(r.type_code||'').toUpperCase()==='VP');
        const sp=active.filter(r=>String(r.object_type||r.type_code||'').toUpperCase().includes('СП')||String(r.type_code||'').toUpperCase()==='SP');
        const covered=[],uncovered=[];
        objs.forEach(o=>{const hits=sts.map(s=>({s,dist:km(o,s),radius:+s.coverage_radius_km||15})).filter(x=>x.dist<=x.radius).sort((a,b)=>a.dist-b.dist);const nearest=sts.map(s=>({s,dist:km(o,s)})).sort((a,b)=>a.dist-b.dist)[0];(hits.length?covered:uncovered).push({...o,hits,nearest});});
        kpi([
          ['Активні ВП/СП',active.length,`ВП: ${vp.length} · СП: ${sp.length}`],
          ['З координатами',objs.length,pct(objs.length,active.length)+' від активних'],
          ['Прикрито',covered.length,pct(covered.length,objs.length)+' від обʼєктів з координатами'],
          ['Неприкрито',uncovered.length,'потребують рішення'],
          ['Активні станції',st.length,'з координатами: '+sts.length],
          ['Заявки Excel',req,'norm_excel_requests'],
          ['Події Word',events,'norm_word_events'],
          ['Подвійне прикриття',covered.filter(o=>o.hits.length>1).length,'2+ станції в радіусі']
        ]);
        q('#coverage').innerHTML=`<table class="table"><tbody><tr><th>Обʼєкти з координатами</th><td>${objs.length}</td></tr><tr><th>Станції з координатами</th><td>${sts.length}</td></tr><tr><th>Покрито</th><td>${covered.length} (${pct(covered.length,objs.length)})</td></tr><tr><th>Без прикриття</th><td>${uncovered.length}</td></tr></tbody></table>`;
        q('#uncovered').innerHTML=uncovered.length?`<div class="list">${uncovered.slice(0,40).map(o=>`<div class="item"><b>${esc(o.object_name)}</b><span>${esc(o.object_type||o.type_code||'')} · найближча: ${esc(o.nearest?.s?.station_name||'—')} ${o.nearest?Math.round(o.nearest.dist*10)/10+' км':''}</span></div>`).join('')}</div>`:'<p class="muted">Усі обʼєкти з координатами потрапляють у радіуси станцій.</p>';
        q('#status').textContent='Оновлено: '+new Date().toLocaleString('uk-UA');
      }catch(e){console.error(e);q('#status').innerHTML='<span class="err">'+esc(e.message||e)+'</span>';}
    }
    q('#refresh').addEventListener('click',run); run();
  </script>
</body>
</html>
