name: Verify map package export

on:
  push:
    paths:
      - .github/workflows/verify-map-package-export.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check JavaScript syntax
        run: |
          node --check official/map-package-export.js
          node --check official/app.js
      - name: Remove verification workflow
        run: |
          rm -f .github/workflows/verify-map-package-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-map-package-export.yml
          git commit -m "Verify map package export syntax"
          git push